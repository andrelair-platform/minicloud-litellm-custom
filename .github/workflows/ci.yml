name: Build and Push

on:
  push:
    branches: [main, staging, dev]
    paths:
      - 'Dockerfile'
      - '**.py'
  pull_request:
    branches: [main, staging]
    paths:
      - 'Dockerfile'
      - '**.py'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: andrelair-platform/minicloud-litellm-custom

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          VERSION=$(grep 'LITELLM_VERSION' Dockerfile | sed 's/.*=//')
          BASE="${VERSION:-$(git rev-parse --short HEAD)}"
          BRANCH=${GITHUB_REF_NAME}
          if [ "$BRANCH" = "main" ]; then
            TAG="${BASE}"
          else
            TAG="${BRANCH}-${BASE}"
          fi
          echo "tag=${TAG}"       >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        if: github.event_name == 'push' && github.ref_name != 'dev'
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.event_name == 'push' && github.ref_name != 'dev'
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Update image tag in minicloud-gitops (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          NEW_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/andrelair-platform/minicloud-gitops.git
          cd minicloud-gitops
          git config user.name 'AndreLiar'
          git config user.email 'andrelaurelyvan.kanmegnetabouguie@ynov.com'
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import 2>/dev/null || true
          git config commit.gpgsign true
          git config user.signingkey FD6D39D681DEFA34
          sed -i "s|ghcr.io/andrelair-platform/minicloud-litellm-custom:.*|ghcr.io/andrelair-platform/minicloud-litellm-custom:${NEW_TAG}|g" \
            manifests/ai/01-litellm-deployment.yaml
          git add manifests/ai/01-litellm-deployment.yaml
          git diff --cached --quiet || \
            git commit -S -m "ci(litellm): bump image to ${NEW_TAG}"
          git push
